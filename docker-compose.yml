services:
  collector:
    image: ghcr.io/zaiwuli/shiliu:latest
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your Avdb database}
      AVDB_URL: ${AVDB_URL:-}
      AVDB_API_KEY: ${AVDB_API_KEY:-}
    restart: unless-stopped
